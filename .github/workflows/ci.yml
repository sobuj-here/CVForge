name: CVForge CI - Web Validation & Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-validation:
    name: Validate Web Application & Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check JavaScript Syntax
        run: python tests/check_js_syntax.py

      - name: Verify Bundle Syntax
        run: node --check assets/js/bundle.js

      - name: Run Core Verification Suite
        run: python tests/verify.py

      - name: Run 10 Formats & 50 Templates Audit
        run: python tests/test_10_formats_and_templates.py

      - name: Run DOCX Export Purity & Editability Test
        run: python tests/test_docx_editing.py

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CVForge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
