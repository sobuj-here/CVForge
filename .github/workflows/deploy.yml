name: Deploy CVForge to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Web Application & Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check JavaScript Syntax
        run: python tests/check_js_syntax.py

      - name: Verify Bundle Syntax
        run: node --check assets/js/bundle.js

      - name: Run Core Verification Suite
        run: python tests/verify.py

      - name: Run 10 Formats & 50 Templates Audit
        run: python tests/test_10_formats_and_templates.py

      - name: Run DOCX Export Purity & Editability Test
        run: python tests/test_docx_editing.py

      - name: Run Complete Professional Upgrade Verification
        run: python tests/test_complete_professional_upgrade.py

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
